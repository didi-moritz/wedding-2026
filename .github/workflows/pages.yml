# Deploy static site to GitHub Pages.
# Builds puzzle.js from puzzle.source.js (answers stripped) and
# publishes without the editor source file.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build puzzle (strip answers)
        run: node scripts/build-puzzle.mjs

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp index.html raetsel.html anleitung.html _site/
          cp -R css js _site/
          mkdir -p _site/data
          cp data/puzzle.js _site/data/
          # puzzle.source.js intentionally omitted

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
