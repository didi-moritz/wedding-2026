<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
  />
  <meta name="theme-color" content="#0b1f14" />
  <title>Kreuzworträtsel</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="puzzle">
  <main class="page">
    <div class="topbar">
      <a href="index.html">← Start</a>
      <a href="anleitung.html">Anleitung</a>
    </div>

    <header class="puzzle-head">
      <h1 id="puzzle-title">Kreuzworträtsel</h1>
      <p class="lede" id="puzzle-subtitle"></p>
    </header>

    <div id="puzzle-error" class="error-box" hidden></div>

    <div class="solution-bar">
      <strong>Lösungswort</strong>
      <div class="solution-word" id="solution-word" aria-live="polite">·····</div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Kreuzworträtsel"></div>
    </div>

    <div class="clues" id="clues"></div>
  </main>

  <script src="data/puzzle.js"></script>
  <script src="js/crossword.js"></script>

</html>
